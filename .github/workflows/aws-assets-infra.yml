name: AWS asset storage infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      terraform_action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
  pull_request:
    paths:
      - "infra/aws/assets/**"
      - ".github/workflows/aws-assets-infra.yml"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: infra/aws/assets
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_project_name: pulse
      TF_VAR_environment: ${{ github.event.inputs.environment || 'staging' }}
      TF_VAR_allowed_cors_origins: ${{ vars.PULSE_ASSET_ALLOWED_CORS_ORIGINS_JSON || '[]' }}
      TF_VAR_asset_domain_name: ${{ vars.PULSE_ASSET_DOMAIN_NAME || '' }}
      TF_VAR_cloudfront_certificate_arn: ${{ vars.PULSE_ASSET_CLOUDFRONT_CERTIFICATE_ARN || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply' }}
        run: terraform apply -auto-approve tfplan
